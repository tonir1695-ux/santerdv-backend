spring.application.name=santerdv-api

# --- Base de données (garde ta config existante ici, ex. Render Postgres) ---
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USERNAME}
# spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# --- Email (OTP inscription, identifiants médecin/réceptionniste, rappels) ---
# Envoi via l'API HTTP de Brevo (port 443, jamais bloqué par les hébergeurs
# gratuits — contrairement au SMTP direct, port 587, souvent bloqué).
# Ces valeurs viennent des variables d'environnement configurées sur Render.
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Sant\u00e9 RDV
