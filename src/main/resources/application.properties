spring.application.name=santerdv-api

# --- Base de données (garde ta config existante ici, ex. Render Postgres) ---
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USERNAME}
# spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# --- Email (OTP inscription, identifiants médecin/réceptionniste, rappels) ---
# Envoi via l'API HTTP d'EmailJS (port 443, jamais bloqué par les hébergeurs
# gratuits). EmailJS relaie à travers un compte Gmail personnel connecté par
# autorisation Google classique, sans mot de passe d'application ni vérification
# d'entreprise. Ces valeurs viennent des variables d'environnement Render.
emailjs.service.id=${EMAILJS_SERVICE_ID}
emailjs.template.id=${EMAILJS_TEMPLATE_ID}
emailjs.public.key=${EMAILJS_PUBLIC_KEY}
emailjs.private.key=${EMAILJS_PRIVATE_KEY}
